name: Release

# Ein Tag wie v1.0.0 baut die .exe + Quellcode-Zip und veröffentlicht sie als GitHub-Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: python .github/build_release.py
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --title "${{ github.ref_name }}" --notes "Automatischer Build. Prüfsummen in manifest.json."
